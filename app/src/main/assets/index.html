<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recepție AI Miron DEMO</title><style>body{font:16px system-ui;margin:0;background:#f0f6fc;color:#17314b}header{background:#1362a5;color:white;padding:22px}main{padding:18px;max-width:650px;margin:auto}.card{background:white;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #c7d8e7}button{border:0;border-radius:9px;background:#1266ad;color:white;padding:13px;margin:5px 4px 5px 0;font-size:15px}button.secondary{background:#e5eff8;color:#164b77}button.ok{background:#167b55}button.no{background:#a54040}input,select{box-sizing:border-box;width:100%;padding:12px;margin:7px 0 13px;border:1px solid #aac0d3;border-radius:8px;font-size:16px}label{font-weight:600}small{color:#526b80}.status{font-weight:bold;color:#8b5a00}</style></head><body><header><strong>Recepție AI – DEMO</strong><div>Cabinet Dr. Miron A. Ana • Suceava</div></header><main><div class="card"><b>Doar pentru demonstrație</b><p>Nu introduceți nume, telefoane sau alte date reale. Nu există apeluri AI, SMS sau sincronizare între dispozitive.</p><button onclick="page('new')">Solicită programare</button><button class="secondary" onclick="page('staff')">Medic / Asistentă</button><button class="secondary" onclick="page('agenda')">Agendă</button></div><div id="view"></div></main><script>
const hours=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];let items=[];try{items=JSON.parse(localStorage.getItem('demoMiron')||'[]')}catch(e){};let role='Medic';function save(){localStorage.setItem('demoMiron',JSON.stringify(items))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function workday(d){let x=new Date(d+'T12:00:00').getDay();return x>=1&&x<=5}function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function page(p){let v=document.getElementById('view');if(p==='new'){v.innerHTML='<div class="card"><h2>Solicitare nouă</h2><form id="f"><label>Pacient fictiv</label><input name="name" required placeholder="Pacient Test"><label>Tip consultație</label><select name="type"><option>Prima consultație</option><option>Control</option></select><label>Data</label><input name="date" type="date" min="'+today()+'" required><label>Ora</label><select name="hour">'+hours.map(h=>'<option>'+h+'</option>').join('')+'</select><button>Trimite solicitarea</button></form><small>Durata consultației: 60 minute. Solicitarea necesită aprobare.</small></div>';document.getElementById('f').onsubmit=e=>{e.preventDefault();let a=new FormData(e.target),date=a.get('date'),hour=a.get('hour');if(!workday(date)){alert('Cabinetul este deschis luni-vineri.');return}if(items.some(i=>i.date===date&&i.hour===hour&&i.status!=='Respinsă')){alert('Ora este deja rezervată sau în așteptare.');return}items.push({id:Date.now(),name:a.get('name'),type:a.get('type'),date,hour,status:'În așteptare',by:''});save();alert('Solicitarea a fost înregistrată. Așteaptă aprobarea.');page('staff')}}else if(p==='staff'){v.innerHTML='<div class="card"><h2>Personal cabinet</h2><label>Rol demonstrativ</label><select id="role"><option>Medic</option><option>Asistentă</option></select><small>Nu există autentificare reală în această versiune.</small></div>'+items.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.hour.localeCompare(b.hour)).map(i=>'<div class="card"><b>'+esc(i.name)+'</b><p>'+esc(i.type)+' • '+esc(i.date)+' • '+esc(i.hour)+'</p><p class="status">'+esc(i.status)+'</p>'+(i.status==='În așteptare'?'<button class="ok" onclick="decision('+i.id+',true)">Aprobă</button><button class="no" onclick="decision('+i.id+',false)">Respinge</button>':'<small>Decizie: '+esc(i.by)+'</small>')+'</div>').join('')+'<button class="secondary" onclick="page(\'agenda\')">Vezi agenda</button>';document.getElementById('role').value=role;document.getElementById('role').onchange=e=>role=e.target.value}else if(p==='agenda'){v.innerHTML='<div class="card"><h2>Agenda</h2><label>Data</label><input type="date" id="day" value="'+today()+'"><div id="slots"></div></div>';document.getElementById('day').onchange=agenda;agenda()}}function decision(id,yes){let i=items.find(x=>x.id===id);if(i){i.status=yes?'Aprobată':'Respinsă';i.by=role;save();page('staff')}}function agenda(){let d=document.getElementById('day').value;document.getElementById('slots').innerHTML=hours.map(h=>{let i=items.find(x=>x.date===d&&x.hour===h&&x.status!=='Respinsă');return '<p><b>'+h+'</b> — '+(i?esc(i.name)+' ('+esc(i.status)+')':'Liber')+'</p>'}).join('')}page('staff');
</script></body></html>
